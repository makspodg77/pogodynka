# zawartosc pliku wygenerowanap przez SI
App\Entity\Location:
    properties:
        name:
            - NotBlank: { groups: [create, edit] }
            - Length: { max: 255, groups: [create, edit] }
        country:
            - NotBlank: { groups: [create, edit] }
            - Length: { min: 2, max: 2, groups: [create, edit] }
        latitude:
            - NotBlank: { groups: [create] }
            - Range: { min: -90, max: 90, groups: [create, edit] }
        longitude:
            - NotBlank: { groups: [create] }
            - Range: { min: -180, max: 180, groups: [create, edit] }
App\Entity\Measurement:
    properties:
        location:
            - NotNull: { groups: [create, edit] }
        date:
            - NotBlank: { groups: [create, edit] }
        temprature:
            - NotBlank: { groups: [create, edit] }
            - Range: { min: -90, max: 60, groups: [create, edit] }
        windiness:
            - NotBlank: { groups: [create, edit] }
            - PositiveOrZero: { groups: [create, edit] }
        cloudiness:
            - NotBlank: { groups: [create, edit] }
            - Range: { min: 0, max: 100, groups: [create, edit] }
        rainfall:
            - NotBlank: { groups: [create, edit] }
            - PositiveOrZero: { groups: [create, edit] }
